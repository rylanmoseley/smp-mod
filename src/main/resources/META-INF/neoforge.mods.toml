# The name of the mod loader type to load - for Kotlin for Forge, use "kotlinforforge"
modLoader="kotlinforforge"

# Version range of the loader
loaderVersion="${loader_version_range}"

# License for your mod
license="${mod_license}"

# A list of mods to load and their properties
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# NeoForge Dependency
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft Dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Kotlin for Forge Dependency
[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="${kff_version_range}"
    ordering="BEFORE"
    side="BOTH"

# Open Parties and Claims (OPAC) Optional Integration
[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    type="optional"
    versionRange="[0.33.0,)"
    ordering="AFTER"
    side="BOTH"
