# Minecraft Server Properties - SMP Mod Suite Production Profile
# Minecraft Version: 1.21.1 / NeoForge 21.1.234

# Network & Performance Tuning
# Note: Set to 25566 to avoid collision with primary servers running on default 25565
server-port=25566
server-ip=
network-compression-threshold=256
max-tick-time=60000
rate-limit=0
sync-chunk-writes=true
prevent-proxy-connections=false

# World Generation & Boundaries
level-name=world
level-seed=
level-type=minecraft\:normal
generator-settings={}
allow-nether=true
generate-structures=true
max-world-size=29999984
spawn-protection=0

# Render & Simulation Distances
# Optimal balance between view fidelity and CPU tick overhead on Tectonic terrain
view-distance=10
simulation-distance=8

# Gameplay & Difficulty
difficulty=hard
gamemode=survival
hardcore=false
pvp=true
allow-flight=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
max-players=24

# Sleep & Day/Night Cycle
# SMP Mod Suite handles dynamic sleep percentage natively via SmpConfig
players-sleeping-percentage=1

# Access Control & Security
white-list=true
enforce-whitelist=true
online-mode=true
enable-status=true
enable-query=false
enable-rcon=false
broadcast-rcon-to-ops=true
broadcast-console-to-ops=true
op-permission-level=4
function-permission-level=2
hide-online-players=false

# Resource Pack Sync (Optional - set URL and SHA-1 hash to auto-deliver client assets)
resource-pack=
resource-pack-id=
resource-pack-sha1=
require-resource-pack=false
resource-pack-prompt=

# Server Branding & Motd
motd=\u00A76\u00A7lSMP Mod Suite \u00A78| \u00A7fDynamic Survival \u00A77[1.21.1 NeoForge]
