# SMP Mod Suite - Expedition Parchment Design Tokens
# Single source of truth for surfaces, pigments, typography, subsystems, and roles.

[project]
name = "SMP Mod Suite"
mod_id = "smpmod"
modrinth_id = "smpmod-rdiamondcreeper"
modrinth_slug = "smpmod-rdiamondcreeper"
version = "0.0.1-prerelease1"
mc_version = "1.21.1"
loader = "NeoForge"
license = "MIT"
tagline = "Cohesive Systems for Cooperative Survival"
pack_name = "SMP Survival Suite"
pack_loader = "Packwiz"

[colors]
# Surfaces
parchment_base    = "#F2EAD7"   # Warm aged vellum (primary background)
parchment_inset   = "#E6DBC2"   # Recessed ledger / card paper
parchment_edge    = "#D5C5A3"   # Aged margin / shadow wash
leather_cover     = "#2C221B"   # Deep saddle-leather (used for modpack cover & plate framing)

# Ink & Rules
ink_primary       = "#231F1B"   # Iron-gall charcoal ink
ink_secondary     = "#5A4E42"   # Warm sepia / umber
ink_faint         = "#8C7D6B"   # Survey grid lines, contours, paper flecks
rule_border       = "#A69478"   # Printed ledger hairline border

# Earth & Mineral Pigments (one per subsystem)
pigment_ochre     = "#B47B2B"   # Economy & Commerce (tarnished gold)
pigment_plum      = "#7A3E5D"   # Death Recovery & Item Lore (wax seal)
pigment_moss      = "#3D6B48"   # Land Claims & Settlements (pine/territory)
pigment_cobalt    = "#355E7E"   # World Navigation & Survival (cartographic blue)
pigment_vermilion = "#A8382B"   # Emergent Roles & Combat (iron oxide)
pigment_slate     = "#4D545E"   # Server Utilities & Moderation (wrought iron)

[typography]
font_display = "Fraunces"
font_heading = "Cinzel"
font_body    = "Source Sans 3"
font_pixel   = "Silkscreen"
font_mono    = "JetBrains Mono"

[[subsystems]]
id = "economy"
index = "01"
numeral = "I"
name = "Economy & Commerce"
kicker = "Monetary Ledger"
accent = "#B47B2B"
motif = "survey-ledger"
subtitle = "Digital Currency · Milestone Faucets · Villager Encapsulation · Bulk Store"

